<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<title>Latest Rates Of Exchange</title>

	<script src="https://code.jquery.com/jquery-3.7.0.js"
	        integrity="sha256-JlqSTELeR4TLqP0OG9dxM7yDPqX1ox/HfgiSLBj8+kM="
	        crossorigin="anonymous">
	</script>

	<link
			href="https://cdn.datatables.net/v/dt/jq-3.7.0/dt-1.13.7/datatables.min.css"
			rel="stylesheet">

	<script
			src="https://cdn.datatables.net/v/dt/jq-3.7.0/dt-1.13.7/datatables.min.js">
	</script>


	<link rel="stylesheet"
	      href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
	      integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
	      crossorigin="anonymous">

	<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
			integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
			crossorigin="anonymous">
	</script>

	<script type="text/javascript">
		$(document).ready(function() {
			$('#latest_table').DataTable();
			$('#currencySelect').on('change', function() {
				let selectedCurrency = $(this).val();
				console.log(selectedCurrency);
				$('.currency-column').text(selectedCurrency);
				window.location.href =
						'/northharbordemo/viewLatest?currency=' + selectedCurrency;
			});
		});

	</script>

</head>
<style>
         body {
            background-color: #8fa8c4;        
         }
</style>	
<body>
<table id="latest_table">
	<thead>
	<tr>
		<th>Currency From
			<br>
			<select id="currencySelect"  style="background-color: LightSteelBlue">
				<option th:each="currencyItem : ${currencies}"
				        th:value="${currencyItem}"
				        th:text="${currencyItem}"
				        th:selected="${currencyItem == selectedCurrency}">
				</option>
			</select>
		</th>
		<th>Currency To</th>
		<th>Date</th>
		<th>Rate Of Exchange</th>
	</tr>
	</thead>
	<tbody>
	<tr th:each="latestItem : ${latestList}">
		<td th:text="${selectedCurrency}" class="currency-column"></td>
		<td th:text="${latestItem.toCurrency}"></td>
		<td th:text="${latestItem.date}"></td>
		<td th:text="${latestItem.rate}"></td>
	</tr>
	</tbody>
</table>
</body>
</html>
