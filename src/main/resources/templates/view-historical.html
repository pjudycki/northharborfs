<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Historical Rates Of Exchange</title>
<script src="https://code.jquery.com/jquery-3.7.0.js"
	integrity="sha256-JlqSTELeR4TLqP0OG9dxM7yDPqX1ox/HfgiSLBj8+kM="
	crossorigin="anonymous"></script>
<link
	href="https://cdn.datatables.net/v/dt/jq-3.7.0/dt-1.13.7/datatables.min.css"
	rel="stylesheet">
<script
	src="https://cdn.datatables.net/v/dt/jq-3.7.0/dt-1.13.7/datatables.min.js"></script>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
	integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
	crossorigin="anonymous">
<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
	integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
	crossorigin="anonymous"></script>
<script src="http://code.jquery.com/ui/1.13.2/jquery-ui.js"></script>
<link
	href="https://code.jquery.com/ui/1.13.2/themes/ui-lightness/jquery-ui.css"
	rel="stylesheet">
<script type="text/javascript">
	$(document).ready(function() {
		$('#historical_table').DataTable();
		$('#datepicker').datepicker();
	});
</script>
</head>
<body>
	<p>
		Date: <input type="text" id="datepicker">
	</p>
	<table id="historical_table">
		<thead>
			<tr>
				<th>Currency From</th>
				<th>Currency To</th>
				<th>Date</th>
				<th>Rate Of Exchange</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="historicalItem : ${historicalList}">

				<td th:text="${historicalItem.fromCurrency}"></td>
				<td th:text="${historicalItem.toCurrency}"></td>
				<td th:text="${historicalItem.date}"></td>
				<td th:text="${historicalItem.rate}"></td>
			</tr>

		</tbody>
	</table>
</body>
</html>
