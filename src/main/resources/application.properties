server.port = 8080
spring.application.name = North Harbor Demo

server.servlet.context-path =/northharbordemo
spring.mvc.view.prefix = /WEB-INF/jsp/
spring.mvc.view.suffix = .jsp

exchange.rate.api.endpoint = http://api.exchangeratesapi.io/v1/
exchange.rate.api.key =
security.allowed.origins.urlList = http://localhost:4200

spring.datasource.driverClassName = com.mysql.cj.jdbc.Driver
spring.datasource.url = jdbc:mysql://localhost:3306/northharbordb?useSSL=false&serverTimezone=UTC
spring.datasource.username = admin
spring.datasource.password =
spring.datasource.testOnBorrow = true
spring.datasource.testWhileIdle = true
spring.datasource.timeBetweenEvictionRunsMillis = 60000
spring.datasource.minEvictableIdleTimeMillis = 30000
spring.datasource.validationQuery = SELECT 1
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=8000
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect